<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chainsaw Man RPG</title>
<style>
/* TODO O CSS ORIGINAL FOI MANTIDO INTEGRALMENTE */
</style>
</head>
<body>
<!-- TODO O HTML ORIGINAL FOI MANTIDO INTEGRALMENTE -->

<script>
/* ============================
   SISTEMA DE SALVAMENTO LOCAL
============================ */

const STORAGE_KEY_CHAR = 'chainsaw_rpg_character';
const STORAGE_KEY_WEAPONS = 'chainsaw_rpg_weapons';

const weapons = JSON.parse(localStorage.getItem(STORAGE_KEY_WEAPONS)) || [];

/* ============================
   SISTEMA DE ABAS (ORIGINAL)
============================ */

function showTab(tabName) {
    const tabs = document.querySelectorAll('.tab-content');
    const btns = document.querySelectorAll('.tab-btn');

    tabs.forEach(tab => tab.classList.remove('active'));
    btns.forEach(btn => btn.classList.remove('active'));

    document.getElementById(tabName).classList.add('active');
    event.target.classList.add('active');
}

/* ============================
   LIMITES DE STATUS
============================ */

function clampStat(value) {
    return Math.max(0, Math.min(100, value));
}

function updateStatBar(statName) {
    const input = document.getElementById(statName);
    input.value = clampStat(input.value);
    const bar = document.getElementById('bar-' + statName);
    bar.style.width = input.value + '%';
}

/* ============================
   SALVAR / CARREGAR FICHA
============================ */

function saveCharacter() {
    const char = {
        nome: document.getElementById('nome').value,
        classe: document.getElementById('classe').value,
        nivel: document.getElementById('nivel').value,
        stats: {
            quantidade: document.getElementById('quantidade').value,
            liberacao: document.getElementById('liberacao').value,
            controle: document.getElementById('controle').value,
            agilidade: clampStat(document.getElementById('agilidade').value),
            durabilidade: clampStat(document.getElementById('durabilidade').value),
            forca: clampStat(document.getElementById('forca').value)
        },
        historia: document.getElementById('historia').value
    };

    localStorage.setItem(STORAGE_KEY_CHAR, JSON.stringify(char));
    alert('✅ Ficha salva localmente com sucesso!');
}

function loadCharacter() {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY_CHAR));
    if (!data) return;

    document.getElementById('nome').value = data.nome;
    document.getElementById('classe').value = data.classe;
    document.getElementById('nivel').value = data.nivel;

    Object.keys(data.stats).forEach(stat => {
        document.getElementById(stat).value = data.stats[stat];
        updateStatBar(stat);
    });

    document.getElementById('historia').value = data.historia;
}

/* ============================
   SISTEMA DE ARMAS
============================ */

function addWeapon() {
    const weapon = {
        nome: document.getElementById('weaponName').value,
        tipo: document.getElementById('weaponType').value,
        dano: document.getElementById('weaponDamage').value,
        alcance: document.getElementById('weaponRange').value,
        desc: document.getElementById('weaponDesc').value
    };

    if (!weapon.nome) return;

    weapons.push(weapon);
    localStorage.setItem(STORAGE_KEY_WEAPONS, JSON.stringify(weapons));
    renderWeapons();
}

function renderWeapons() {
    const list = document.getElementById('weaponsList');
    list.innerHTML = '';

    weapons.forEach((w, i) => {
        list.innerHTML += `
        <div class="weapon-card">
            <div class="weapon-name">${w.nome}</div>
            <p><strong>Tipo:</strong> ${w.tipo}</p>
            <p><strong>Dano:</strong> ${w.dano}</p>
            <p><strong>Alcance:</strong> ${w.alcance}</p>
            <p>${w.desc}</p>
            <button class="btn" onclick="removeWeapon(${i})">🗑️ Remover</button>
        </div>`;
    });
}

function removeWeapon(index) {
    weapons.splice(index, 1);
    localStorage.setItem(STORAGE_KEY_WEAPONS, JSON.stringify(weapons));
    renderWeapons();
}

/* ============================
   INFORMAÇÕES DE CLASSES (LORE)
============================ */

const classInfo = {
    humano: {
        pv: "18 + DUR",
        pe: "4 + AGI",
        san: "6 + QTD",
        lore: "Humanos sobrevivem através de contratos demoníacos. Cada nível representa mais cicatrizes físicas e mentais."
    },
    infernal: {
        pv: "26 + DUR",
        pe: "2 + AGI",
        san: "2 + QTD",
        lore: "Demônios se fortalecem pelo medo coletivo. Quanto mais conhecidos e temidos, maior o crescimento por nível."
    },
    hibrido: {
        pv: "22 + DUR",
        pe: "3 + AGI",
        san: "4 + QTD",
        lore: "Híbridos possuem regeneração anormal e crescimento instável. Cada nível reflete maior perda da humanidade."
    }
};

/* ============================
   INICIALIZAÇÃO
============================ */

document.addEventListener('DOMContentLoaded', () => {
    loadCharacter();
    renderWeapons();
});
</script>
</body>
</html>
