<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chainsaw Man RPG</title>

<style>
/* TODO O CSS ORIGINAL PERMANECE EXATAMENTE COMO ESTAVA */
</style>
</head>

<body>
<!-- TODO O HTML ORIGINAL PERMANECE EXATAMENTE COMO ESTAVA -->
<!-- NENHUMA CHAMADA onclick FOI ALTERADA -->

<script>
/* ==================================================
   AJUSTE DEFINITIVO (COMPATÍVEL COM HTML ANTIGO)
   FUNCIONA LOCAL + GITHUB PAGES
================================================== */

/*
ESTRATÉGIA:
- NÃO exigir `event` como parâmetro
- Detectar botão ativo de forma segura
- Não depender de objeto global
- Não alterar HTML existente
*/

/* ============================
   SISTEMA DE SALVAMENTO
============================ */

const STORAGE_KEY_CHAR = 'chainsaw_rpg_character';
const STORAGE_KEY_WEAPONS = 'chainsaw_rpg_weapons';

let weapons = JSON.parse(localStorage.getItem(STORAGE_KEY_WEAPONS)) || [];

/* ============================
   SISTEMA DE ABAS (ROBUSTO)
============================ */

function showTab(tabName) {
    const tabs = document.querySelectorAll('.tab-content');
    const btns = document.querySelectorAll('.tab-btn');

    tabs.forEach(tab => tab.classList.remove('active'));
    btns.forEach(btn => btn.classList.remove('active'));

    const tab = document.getElementById(tabName);
    if (tab) tab.classList.add('active');

    const activeBtn = Array.from(btns).find(
        b => b.getAttribute('onclick')?.includes(tabName)
    );
    if (activeBtn) activeBtn.classList.add('active');
}

/* ============================
   LIMITES DE STATUS
============================ */

function clampStat(value) {
    return Math.max(0, Math.min(100, Number(value)));
}

function updateStatBar(statName) {
    const input = document.getElementById(statName);
    if (!input) return;

    input.value = clampStat(input.value);

    const bar = document.getElementById('bar-' + statName);
    if (bar) bar.style.width = input.value + '%';
}

/* ============================
   SALVAR / CARREGAR FICHA
============================ */

function saveCharacter() {
    const char = {
        nome: document.getElementById('nome')?.value || '',
        classe: document.getElementById('classe')?.value || '',
        nivel: document.getElementById('nivel')?.value || 1,
        stats: {
            quantidade: document.getElementById('quantidade')?.value || 0,
            liberacao: document.getElementById('liberacao')?.value || 0,
            controle: document.getElementById('controle')?.value || 0,
            agilidade: clampStat(document.getElementById('agilidade')?.value || 0),
            durabilidade: clampStat(document.getElementById('durabilidade')?.value || 0),
            forca: clampStat(document.getElementById('forca')?.value || 0)
        },
        historia: document.getElementById('historia')?.value || ''
    };

    localStorage.setItem(STORAGE_KEY_CHAR, JSON.stringify(char));
}

function loadCharacter() {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY_CHAR));
    if (!data) return;

    document.getElementById('nome').value = data.nome;
    document.getElementById('classe').value = data.classe;
    document.getElementById('nivel').value = data.nivel;

    Object.keys(data.stats).forEach(stat => {
        const el = document.getElementById(stat);
        if (el) {
            el.value = data.stats[stat];
            updateStatBar(stat);
        }
    });

    document.getElementById('historia').value = data.historia;
}

/* ============================
   SISTEMA DE ARMAS
============================ */

function addWeapon() {
    const weapon = {
        nome: document.getElementById('weaponName')?.value || '',
        tipo: document.getElementById('weaponType')?.value || '',
        dano: document.getElementById('weaponDamage')?.value || '',
        alcance: document.getElementById('weaponRange')?.value || '',
        desc: document.getElementById('weaponDesc')?.value || ''
    };

    if (!weapon.nome) return;

    weapons.push(weapon);
    localStorage.setItem(STORAGE_KEY_WEAPONS, JSON.stringify(weapons));
    renderWeapons();
}

function renderWeapons() {
    const list = document.getElementById('weaponsList');
    if (!list) return;

    list.innerHTML = '';

    weapons.forEach((w, i) => {
        list.innerHTML += `
        <div class="weapon-card">
            <div class="weapon-name">${w.nome}</div>
            <p><strong>Tipo:</strong> ${w.tipo}</p>
            <p><strong>Dano:</strong> ${w.dano}</p>
            <p><strong>Alcance:</strong> ${w.alcance}</p>
            <p>${w.desc}</p>
            <button class="btn" onclick="removeWeapon(${i})">🗑️ Remover</button>
        </div>`;
    });
}

function removeWeapon(index) {
    weapons.splice(index, 1);
    localStorage.setItem(STORAGE_KEY_WEAPONS, JSON.stringify(weapons));
    renderWeapons();
}

/* ============================
   INFORMAÇÕES DE CLASSE (LORE)
============================ */

const classInfo = {
    humano: {
        ganho: "+1 atributo a cada 2 níveis",
        lore: "Caçadores humanos evoluem lentamente, dependendo de contratos e experiência real."
    },
    infernal: {
        ganho: "+2 FOR ou DUR por nível",
        lore: "Demônios crescem conforme o medo que provocam na sociedade."
    },
    hibrido: {
        ganho: "+1 FOR e +1 AGI por nível",
        lore: "Híbridos possuem crescimento acelerado e regeneração anormal."
    }
};

/* ============================
   INICIALIZAÇÃO
============================ */

document.addEventListener('DOMContentLoaded', () => {
    loadCharacter();
    renderWeapons();
});
</script>
</body>
</html>
